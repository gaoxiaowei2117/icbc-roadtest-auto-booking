name: Build release binaries

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: icbc-control-panel-linux
            binary: icbc-control-panel
          - os: macos-latest
            asset_name: icbc-control-panel-macos
            binary: icbc-control-panel
          - os: windows-latest
            asset_name: icbc-control-panel-windows
            binary: icbc-control-panel.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build executable
        run: pyinstaller icbc-control-panel.spec --noconfirm

      - name: Stage release files
        shell: bash
        run: |
          mkdir -p staging
          cp "dist/${{ matrix.binary }}" staging/
          cat > "staging/README.txt" <<'EOF'
          ICBC 自动预约控制面板
          ========================

          使用方法
          --------
          1. 双击 icbc-control-panel(.exe) 启动
          2. 浏览器会自动打开 http://localhost:xxxx
          3. 在"配置"页填好 ICBC 账号与 Gmail 应用密码
          4. 切到"监控"页点"启动监控"

          关闭程序
          --------
          在弹出的黑色控制台窗口里按 Ctrl+C, 或直接关掉窗口。
          注意:关闭控制台 = 同时停止后台监控。

          Windows 首次启动: SmartScreen 拦截
          ----------------------------------
          点 "更多信息" -> "仍要运行" 即可。

          macOS 首次启动: 弹 "Apple could not verify..." / "无法打开"
          ----------------------------------------------------------
          原因: 此程序没做 Apple 代码签名 (需要 $99/年的开发者账号),
          macOS Gatekeeper 默认拦未签名应用, 跟程序本身的安全性无关。

          【方法 A】系统设置 (推荐, 无需命令行)
          1. 双击 -> 弹出警告框 -> 点 "Done"
             千万别点 "Move to Trash", 那会把文件丢进废纸篓
          2. 打开: 系统设置 (System Settings) -> 隐私与安全性 (Privacy & Security)
          3. 滚动到页面最底部, 会看到一行类似
                "icbc-control-panel" was blocked to protect your Mac.
             旁边有个按钮 "仍要打开 / Open Anyway"
          4. 点 "仍要打开" -> 输入开机密码 / Touch ID 验证
          5. 再次双击程序 -> 这次弹框会多出一个 "打开 / Open" 按钮 -> 点它
          6. 之后双击就直接启动, 不会再拦

          注意: macOS Sonoma (14) 及以上版本已经取消了 "右键 -> 打开" 的
                绕过路径, 必须走上面这条 "系统设置" 路径。

          【方法 B】终端命令 (一行解决, 适合会用命令行的用户)
          打开 "终端" (Terminal), 把下面命令里的路径换成你实际解压的目录,
          回车执行:

              xattr -dr com.apple.quarantine ~/Downloads/icbc-control-panel-macos

          执行完再双击 icbc-control-panel, 不会再弹任何警告。

          详细文档与最新版本
          ------------------
          https://github.com/gaoxiaowei2117/icbc-roadtest-auto-booking
          EOF

      - name: Zip (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x "staging/${{ matrix.binary }}"
          cd staging && zip -r "../${{ matrix.asset_name }}.zip" .

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path staging/* -DestinationPath ${{ matrix.asset_name }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          draft: true
          generate_release_notes: true
